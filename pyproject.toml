[project]
name = "pkbrain"
version = "0.2.0"
description = "PKBrain —— 开源、本地优先、Build in Public 的个人知识库大脑"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10,<4",
    "pydantic>=2.9",
    "PyYAML>=6.0",
    "typer>=0.12",
]

[project.scripts]
pkbrain = "pkbrain.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pkbrain"]

# schema/ 是唯一事实来源，打包时随包分发一份，运行时用 importlib.resources 读取。
[tool.hatch.build.targets.wheel.force-include]
"schema" = "pkbrain/schema"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
